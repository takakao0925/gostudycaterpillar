<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TOEIC 模擬測驗 · MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #1B2A4A;
    --navy-deep: #101A30;
    --ivory: #F6F2E7;
    --paper: #FFFDF8;
    --gold: #B8933E;
    --gold-light: #E4CE93;
    --gold-dim: #DCC488;
    --ink: #20232B;
    --slate: #6B7280;
    --border: #E4DDC6;
    --success: #3F7A5C;
    --success-bg: #E8F1EA;
    --error: #A9442F;
    --error-bg: #FBEAE4;
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--ivory);
    color: var(--ink);
    font-family: 'IBM Plex Sans', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .serif{ font-family: 'Source Serif 4', 'Noto Serif TC', serif; }
  .mono{ font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.02em; }

  a{ color: inherit; }
  button{ font-family: inherit; cursor: pointer; }
  button:focus-visible, [tabindex]:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .app{ max-width: 760px; margin: 0 auto; padding: 0 20px 64px; }

  .topbar{
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color: var(--ivory);
    padding: 18px 20px 22px;
    margin: 0 0 28px;
  }
  .topbar-inner{ max-width: 760px; margin: 0 auto; }
  .topbar-row{ display:flex; align-items:baseline; justify-content:space-between; gap: 12px; flex-wrap: wrap; }
  .exam-title{ font-size: 19px; font-weight: 600; letter-spacing: 0.01em; margin:0; }
  .exam-sub{ font-size: 12px; color: var(--gold-light); margin: 2px 0 0; letter-spacing: 0.06em; }
  .timer{ font-size: 13px; color: var(--gold-light); }

  .scantron{ display:flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .bubble{
    width: 26px; height: 26px; border-radius: 50%;
    border: 1.5px solid rgba(228,206,147,0.55);
    display:flex; align-items:center; justify-content:center;
    font-size: 11px; font-weight: 600; color: rgba(246,242,231,0.6);
    background: transparent;
    transition: all .2s ease;
  }
  .bubble.current{ border-color: var(--gold-light); color: var(--ivory); box-shadow: 0 0 0 3px rgba(228,206,147,0.15); }
  .bubble.done-correct{ background: var(--gold); border-color: var(--gold); color: var(--navy-deep); }
  .bubble.done-wrong{ background: rgba(169,68,47,0.85); border-color: rgba(169,68,47,0.85); color: var(--ivory); }

  .card{
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 28px 26px;
    box-shadow: 0 1px 2px rgba(27,42,74,0.04);
  }
  .eyebrow{ display:flex; align-items:center; gap: 10px; margin-bottom: 14px; }
  .eyebrow-part{
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--navy); background: var(--gold-light); padding: 4px 10px; border-radius: 100px;
  }
  .eyebrow-type{ font-size: 12.5px; color: var(--slate); }

  .prompt{ font-size: 16.5px; line-height: 1.65; margin: 0 0 16px; }
  .passage{
    background: var(--ivory);
    border: 1px solid var(--border);
    border-left: 3px solid var(--gold);
    border-radius: 6px;
    padding: 16px 18px;
    font-size: 14.5px;
    line-height: 1.85;
    white-space: pre-wrap;
    margin-bottom: 18px;
    font-family: 'Source Serif 4', serif;
    color: #33363E;
  }
  .blank{
    display:inline-block; min-width: 46px; text-align:center;
    border-bottom: 2px solid var(--gold);
    font-weight: 700; color: var(--gold);
    font-family: 'IBM Plex Mono', monospace;
    padding: 0 4px;
  }

  .audio-block{
    display:flex; align-items:center; gap: 14px;
    background: var(--navy);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 18px;
  }
  .play-btn{
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--gold); border: none;
    display:flex; align-items:center; justify-content:center;
    flex-shrink: 0;
    transition: transform .15s ease;
  }
  .play-btn:hover{ transform: scale(1.06); }
  .play-btn svg{ width: 16px; height: 16px; }
  .audio-meta{ color: var(--ivory); }
  .audio-meta .label{ font-size: 12px; color: var(--gold-light); letter-spacing: 0.04em; }
  .audio-meta .desc{ font-size: 13px; margin-top: 2px; color: rgba(246,242,231,0.85); }

  .illustration{ margin-bottom: 18px; border-radius: 10px; overflow:hidden; border: 1px solid var(--border); }

  .choices{ display:flex; flex-direction:column; gap: 10px; margin-bottom: 6px; }
  .choice{
    display:flex; align-items:center; gap: 12px;
    text-align:left;
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--ink);
    transition: border-color .15s ease, background .15s ease;
    width: 100%;
  }
  .choice:hover:not(.locked){ border-color: var(--gold); background: #FFFCF3; }
  .choice-key{
    flex-shrink:0; width: 28px; height: 28px; border-radius: 50%;
    border: 1.5px solid var(--slate);
    display:flex; align-items:center; justify-content:center;
    font-size: 12.5px; font-weight: 700; color: var(--slate);
    font-family: 'IBM Plex Mono', monospace;
  }
  .choice.selected .choice-key{ border-color: var(--gold); color: var(--gold); background: var(--gold-light); }
  .choice.correct{ border-color: var(--success); background: var(--success-bg); }
  .choice.correct .choice-key{ border-color: var(--success); color: var(--success); background:#fff; }
  .choice.wrong{ border-color: var(--error); background: var(--error-bg); }
  .choice.wrong .choice-key{ border-color: var(--error); color: var(--error); background:#fff; }
  .choice.locked{ cursor: default; }

  .explain{
    margin-top: 16px; padding: 14px 16px; border-radius: 8px;
    background: var(--ivory); border: 1px dashed var(--gold-dim);
    font-size: 13.5px; line-height: 1.7; color: #3A3D45;
  }
  .explain b{ color: var(--navy); }

  .actions{ display:flex; justify-content:space-between; align-items:center; margin-top: 22px; }
  .btn{ border: none; border-radius: 8px; padding: 11px 20px; font-size: 14px; font-weight: 600; }
  .btn-primary{ background: var(--navy); color: var(--ivory); }
  .btn-primary:disabled{ background: #C9C4B4; color: #8C8779; cursor: not-allowed; }
  .btn-ghost{ background: transparent; color: var(--slate); border: 1px solid var(--border); }

  .hero{ text-align:left; padding: 6px 4px 8px; }
  .hero h1{ font-size: 26px; margin: 0 0 8px; }
  .hero p{ color: var(--slate); font-size: 14.5px; line-height: 1.7; max-width: 60ch; }
  .part-legend{ display:grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; margin: 18px 0 24px; }
  .part-legend div{ font-size: 13px; color: var(--slate); display:flex; gap: 8px; }
  .part-legend b{ color: var(--navy); font-family:'IBM Plex Mono',monospace; }

  .result-score{ text-align:center; padding: 10px 0 6px; }
  .result-score .num{ font-size: 52px; font-weight: 700; color: var(--navy); font-family:'Source Serif 4',serif; }
  .result-score .of{ font-size: 18px; color: var(--slate); }
  .result-list{ margin-top: 22px; display:flex; flex-direction:column; gap:10px; }
  .result-row{
    display:flex; justify-content:space-between; align-items:center;
    padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); font-size: 13.5px;
  }
  .tag{ font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 100px; }
  .tag.ok{ background: var(--success-bg); color: var(--success); }
  .tag.no{ background: var(--error-bg); color: var(--error); }

  @media (prefers-reduced-motion: reduce){ *{ transition: none !important; } }
  @media (max-width: 480px){
    .card{ padding: 20px 18px; }
    .hero h1{ font-size: 22px; }
    .part-legend{ grid-template-columns: 1fr; }
  }

  /* ---------- Flag button & scantron states ---------- */
  .eyebrow{ display:flex; justify-content:space-between; align-items:center; }
  .eyebrow-left{ display:flex; align-items:center; gap:10px; }
  .flag-btn{
    display:flex; align-items:center; gap:5px;
    background: transparent; border: 1px solid var(--border); border-radius: 100px;
    padding: 5px 11px; font-size: 12px; color: var(--slate);
    flex-shrink: 0;
  }
  .flag-btn:hover{ border-color: var(--gold); }
  .flag-btn.active{ border-color: var(--gold); color: var(--navy); background: var(--gold-light); }
  .bubble.answered{ background: var(--gold-light); border-color: var(--gold); color: var(--navy-deep); }
  .bubble.flagged{ box-shadow: 0 0 0 2px var(--error) inset; }

  /* ---------- Home sections: history & hard review ---------- */
  .home-section{ margin-top: 18px; }
  .section-title{ font-size: 18px; margin: 0 0 12px; }
  .section-desc{ font-size: 13px; color: var(--slate); margin: 0 0 12px; }
  .empty-note{ font-size: 13px; color: var(--slate); }
  .storage-note{ font-size: 11.5px; color: var(--slate); margin: -4px 0 12px; }
  .history-list{ display:flex; flex-direction:column; gap: 8px; }
  .history-card{
    display:flex; align-items:center; gap: 12px; width: 100%;
    background: var(--paper); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; text-align:left; font-size: 13.5px;
  }
  .history-card:hover{ border-color: var(--gold); background: #FFFCF3; }
  .grade-dot{ width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .history-main{ display:flex; flex-direction:column; flex:1; gap: 2px; }
  .history-score{ font-weight: 700; color: var(--navy); }
  .history-date{ font-size: 11.5px; color: var(--slate); }
  .history-grade{ font-size: 12px; color: var(--slate); white-space: nowrap; }

  /* ---------- Grade badge & breakdown ---------- */
  .grade-badge{
    display:inline-block; padding: 4px 14px; border-radius: 100px;
    color: #fff; font-size: 12px; font-weight: 700; margin-bottom: 10px;
  }
  .breakdown{ margin: 18px 0; display:flex; flex-direction:column; gap: 8px; }
  .breakdown-row{ display:flex; align-items:center; gap: 10px; }
  .breakdown-label{ width: 60px; font-size: 11.5px; color: var(--slate); flex-shrink: 0; }
  .breakdown-track{ flex:1; height: 8px; background: var(--ivory); border-radius: 4px; overflow:hidden; }
  .breakdown-fill{ height: 100%; background: var(--gold); }
  .breakdown-count{ width: 42px; text-align:right; font-size: 11.5px; color: var(--slate); flex-shrink: 0; }

  /* ---------- Result / review detail blocks ---------- */
  .result-item{ border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .tag.flag{ background: #EFE3C8; color: #8A6A1E; }
  .detail-block{ margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .prompt-mini{ font-size: 14px; margin: 0 0 8px; }
  .mini-choices{ display:flex; flex-direction:column; gap: 6px; margin-bottom: 8px; }
  .mini-choice{
    display:flex; gap: 8px; font-size: 13px; padding: 6px 10px;
    border-radius: 6px; border: 1px solid var(--border); align-items:center;
  }
  .mini-choice .choice-key{
    flex-shrink:0; width: 20px; height: 20px; border-radius: 50%;
    border: 1.5px solid var(--slate); display:flex; align-items:center; justify-content:center;
    font-size: 10.5px; font-weight: 700; color: var(--slate); font-family:'IBM Plex Mono',monospace;
  }
  .mini-choice.correct{ border-color: var(--success); background: var(--success-bg); }
  .mini-choice.correct .choice-key{ border-color: var(--success); color: var(--success); }
  .mini-choice.wrong{ border-color: var(--error); background: var(--error-bg); }
  .mini-choice.wrong .choice-key{ border-color: var(--error); color: var(--error); }
  .your-answer{ font-size: 12.5px; color: var(--slate); margin-bottom: 8px; }
  .concept-tag{
    margin-top: 8px; font-size: 12.5px; color: var(--navy); background: var(--gold-light);
    display:inline-block; padding: 4px 10px; border-radius: 6px;
  }
  .back-btn{ margin-bottom: 14px; }

  /* ---------- Export/Import ---------- */
  .section-title-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px; }
  .section-title-row .section-title{ margin-bottom: 0; }
  .section-actions{ display:flex; gap: 6px; }
  .btn-mini{
    background: transparent; border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; font-size: 12px; color: var(--slate);
  }
  .btn-mini:hover{ border-color: var(--gold); color: var(--navy); }
  .btn-mini:disabled{ opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-row">
      <div>
        <p class="exam-title serif">TOEIC 模擬測驗 <span style="color:var(--gold-light)">· MVP</span></p>
        <p class="exam-sub mono">GOLD TRACK PRACTICE · 10 QUESTIONS · PART 1-7</p>
      </div>
      <div class="timer mono" id="timerDisplay">00:00</div>
    </div>
    <div class="scantron" id="scantron"></div>
  </div>
</div>

<div class="app">
  <div id="screen"></div>
</div>

<script>
const QUESTIONS = [
  {
    id: "p1",
    part: "PART 1", partLabel: "照片描述", mode: "audioChoices",
    audioLabel: "照片描述 · 播放 4 個敘述句",
    voiceNote: "美式女聲",
    illustrationKey: "office",
    prompt: "請聽四個描述句，選出最符合圖片內容的敘述。",
    choices: [
      { key:"A", text:"The woman is writing notes on a laptop while her colleagues look on." },
      { key:"B", text:"The woman is pointing to a chart on the whiteboard as her colleagues listen attentively." },
      { key:"C", text:"The colleagues are rearranging the chairs around the table." },
      { key:"D", text:"The whiteboard has been taken down for cleaning." }
    ],
    answer: "B",
    explanation: "圖片中的女性正指著白板上的圖表進行簡報，另外兩位同事專注聆聽。(A) 誤植動作為「寫筆記」；(C)(D) 皆與圖片中家具/白板狀態不符，屬常見的細節干擾選項。",
    concept: "掌握現在進行式的細節動作描述與辨析"
  },
  {
    id: "p2",
    part: "PART 2", partLabel: "應答問題", mode: "audioChoices",
    audioLabel: "情境問句 · 播放問題與三個回覆",
    voiceNote: "英式男聲提問 · 英式女聲回覆",
    prompt: "請聽一個問題，接著聽三個回覆，選出最適當的回答。",
    choices: [
      { key:"A", text:"Sure, that works better with my schedule." },
      { key:"B", text:"It's down the hall, next to the copier." },
      { key:"C", text:"I called them yesterday afternoon." }
    ],
    questionAudio: "Why don't we reschedule the client call for Thursday afternoon instead?",
    answer: "A",
    explanation: "題目為提議句「Why don't we...」，最適當的回應是直接回應提議是否可行，如 (A)。(B) 是地點回答，答非所問；(C) 利用 call/called 的字面重複做語音陷阱，是典型的高階誘答選項。",
    concept: "提議句（Why don't we...）的回應邏輯；留意音似字陷阱"
  },
  {
    id: "p3",
    part: "PART 3", partLabel: "簡短對話", mode: "audioPassage",
    audioLabel: "對話 · 男女各一句 + 追問",
    voiceNote: "美式男聲 · 美式女聲",
    audioScript: "Man: Have you finished proofreading the quarterly report? Marketing needs it before their two o'clock meeting. Woman: Almost. I just have the appendix left, but I don't think I'll make the deadline. Man: No problem, just send me what you have and I'll fill in the rest before the meeting.",
    prompt: "What will the man most likely do next?",
    choices: [
      { key:"A", text:"Reschedule the meeting" },
      { key:"B", text:"Finish proofreading the appendix" },
      { key:"C", text:"Ask marketing for more time" },
      { key:"D", text:"Print the report" }
    ],
    answer: "B",
    explanation: "男性表示「send me what you have and I'll fill in the rest」，代表他接下來會接手完成附錄的校對工作，答案為 (B)。此題需整合對話中兩人分工的邏輯，屬於推論型考點。",
    concept: "對話中分工邏輯的推論（下一步動作）"
  },
  {
    id: "p4",
    part: "PART 4", partLabel: "簡短獨白", mode: "audioPassage",
    audioLabel: "廣播公告",
    voiceNote: "英式男聲",
    audioScript: "Attention passengers. Due to a mechanical inspection, the 3:15 departure to Chicago has been delayed by approximately forty minutes. We apologize for the inconvenience and ask that ticketed passengers remain near the gate for further updates. Complimentary refreshments are available at the counter for those affected.",
    prompt: "What is the announcement mainly about?",
    choices: [
      { key:"A", text:"A gate change" },
      { key:"B", text:"A flight delay" },
      { key:"C", text:"A ticket price adjustment" },
      { key:"D", text:"A boarding call" }
    ],
    answer: "B",
    explanation: "公告開頭即說明因機械檢查（mechanical inspection）導致班機延誤約 40 分鐘，主旨為航班延誤，答案為 (B)。",
    concept: "廣播/公告主旨題：掌握開場句的核心資訊"
  },
  {
    id: "p5a",
    part: "PART 5", partLabel: "單句文法／字彙 (1/2)", mode: "text",
    prompt: "Had the shipment __________ on time, the client's production schedule would not have been disrupted.",
    choices: [
      { key:"A", text:"arrive" },
      { key:"B", text:"arrived" },
      { key:"C", text:"arriving" },
      { key:"D", text:"to arrive" }
    ],
    answer: "B",
    explanation: "此句為省略 if 的倒裝假設語氣（= If the shipment had arrived on time...），結構為 Had + 主詞 + 過去分詞，因此答案為 (B) arrived。此為金證等級常考的高階文法點。",
    concept: "省略 if 的倒裝假設語氣：Had + 主詞 + p.p."
  },
  {
    id: "p5b",
    part: "PART 5", partLabel: "單句文法／字彙 (2/2)", mode: "text",
    prompt: "The committee's decision was met with such __________ that the CEO called an emergency meeting the following morning.",
    choices: [
      { key:"A", text:"resentful" },
      { key:"B", text:"resentment" },
      { key:"C", text:"resent" },
      { key:"D", text:"resentfully" }
    ],
    answer: "B",
    explanation: "such + 名詞 + that 子句為固定句型（表達「如此…以致於…」），空格須填名詞，故答案為 (B) resentment（不滿、憤慨）。",
    concept: "such + 名詞 + that 子句固定句型"
  },
  {
    id: "p6a",
    part: "PART 6", partLabel: "短文填空 (1/2)", mode: "textPassage",
    passage: "To: All Staff\nFrom: Office of the CEO\nSubject: Update on the Meridian Acquisition\n\nWe are pleased to announce that the acquisition of Meridian Technologies has been finalized ahead of schedule. (46) [BLANK], our combined workforce will begin cross-departmental training sessions next month. All employees are encouraged to review the onboarding materials that (47) [BLANK] to their inbox by Friday.",
    prompt: "第 (46) 格應填入哪個選項？",
    choices: [
      { key:"A", text:"However" },
      { key:"B", text:"Accordingly" },
      { key:"C", text:"Nevertheless" },
      { key:"D", text:"In contrast" }
    ],
    answer: "B",
    explanation: "前句說明收購已提前完成，後句說明將展開跨部門訓練，兩者為順接的因果關係，因此應使用 (B) Accordingly（因此）；(A)(C)(D) 皆為轉折語氣，與文意不符。",
    concept: "文意連接詞：因果順接 vs. 轉折語氣的判斷"
  },
  {
    id: "p6b",
    part: "PART 6", partLabel: "短文填空 (2/2)", mode: "textPassage",
    passage: "To: All Staff\nFrom: Office of the CEO\nSubject: Update on the Meridian Acquisition\n\nWe are pleased to announce that the acquisition of Meridian Technologies has been finalized ahead of schedule. (46) Accordingly, our combined workforce will begin cross-departmental training sessions next month. All employees are encouraged to review the onboarding materials that (47) [BLANK] to their inbox by Friday.",
    prompt: "第 (47) 格應填入哪個選項？",
    choices: [
      { key:"A", text:"will send" },
      { key:"B", text:"will be sent" },
      { key:"C", text:"have sent" },
      { key:"D", text:"are sending" }
    ],
    answer: "B",
    explanation: "空格主詞為 materials（教材），教材是「被寄送」的對象，須用未來式被動語態，因此答案為 (B) will be sent。",
    concept: "被動語態＋未來式的時態判斷"
  },

let HISTORY = [];
let HARDPOOL = {};
let storageBackend = "memory"; // "cloud" | "local" | "memory"

function cloudStorageExists(){
  return typeof window.storage === "object" && window.storage !== null && typeof window.storage.get === "function";
}

async function loadPersistentData(){
  if (cloudStorageExists()){
    try {
      let h = null, p = null;
      try { h = await window.storage.get("toeic-history", false); } catch(e){ h = null; }
      try { p = await window.storage.get("toeic-hardpool", false); } catch(e){ p = null; }
      HISTORY = h && h.value ? JSON.parse(h.value) : [];
      HARDPOOL = p && p.value ? JSON.parse(p.value) : {};
      storageBackend = "cloud";
      return;
    } catch(e){ /* fall through to local */ }
  }
  try {
    const h = localStorage.getItem("toeic-history");
    const p = localStorage.getItem("toeic-hardpool");
    HISTORY = h ? JSON.parse(h) : [];
    HARDPOOL = p ? JSON.parse(p) : {};
    storageBackend = "local";
    return;
  } catch(e){ /* fall through to memory */ }

  HISTORY = [];
  HARDPOOL = {};
  storageBackend = "memory";
}

async function persistHistory(){
  const str = JSON.stringify(HISTORY);
  if (storageBackend === "cloud"){
    try { await window.storage.set("toeic-history", str, false); return; } catch(e){ storageBackend = "local"; }
  }
  if (storageBackend !== "memory"){
    try { localStorage.setItem("toeic-history", str); storageBackend = "local"; return; } catch(e){ storageBackend = "memory"; }
  }
}

async function persistHardPool(){
  const str = JSON.stringify(HARDPOOL);
  if (storageBackend === "cloud"){
    try { await window.storage.set("toeic-hardpool", str, false); return; } catch(e){ storageBackend = "local"; }
  }
  if (storageBackend !== "memory"){
    try { localStorage.setItem("toeic-hardpool", str); storageBackend = "local"; return; } catch(e){ storageBackend = "memory"; }
  }
}

const GZIP_SUPPORTED = (typeof CompressionStream !== "undefined" && typeof DecompressionStream !== "undefined");

async function gzipText(str){
  const stream = new Blob([str]).stream().pipeThrough(new CompressionStream("gzip"));
  return await new Response(stream).blob();
}

async function gunzipBlob(blob){
  const stream = blob.stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(stream).text();
}

async function exportHistory(){
  const payload = {
    format: "toeic-mvp-export",
    version: 1,
    exportedAt: Date.now(),
    history: HISTORY,
    hardPool: HARDPOOL
  };
  const jsonStr = JSON.stringify(payload);
  const dateTag = new Date().toISOString().slice(0, 10);
  let blob, filename;
  if (GZIP_SUPPORTED){
    blob = await gzipText(jsonStr);
    filename = "toeic-history-" + dateTag + ".json.gz";
  } else {
    blob = new Blob([jsonStr], { type: "application/json" });
    filename = "toeic-history-" + dateTag + ".json";
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function triggerImport(){
  document.getElementById("importFileInput").click();
}

async function handleImportFile(fileInput){
  const file = fileInput.files && fileInput.files[0];
  fileInput.value = "";
  if (!file) return;

  let jsonStr = null;
  try {
    jsonStr = await gunzipBlob(file);
  } catch(e){
    try {
      jsonStr = await file.text();
    } catch(e2){
      alert("匯入失敗：無法讀取檔案。");
      return;
    }
  }

  let payload;
  try {
    payload = JSON.parse(jsonStr);
  } catch(e){
    alert("匯入失敗：檔案內容不是有效的匯出格式。");
    return;
  }

  if (!payload || !Array.isArray(payload.history)){
    alert("匯入失敗：檔案格式不正確。");
    return;
  }

  const existingIds = new Set(HISTORY.map(a => a.id));
  let addedCount = 0;
  payload.history.forEach(a => {
    if (a && a.id && !existingIds.has(a.id)){
      HISTORY.push(a);
      existingIds.add(a.id);
      addedCount += 1;
    }
  });
  HISTORY.sort((a, b) => b.timestamp - a.timestamp);

  const importedPool = payload.hardPool || {};
  Object.keys(importedPool).forEach(id => {
    const incoming = importedPool[id];
    if (!HARDPOOL[id]){
      HARDPOOL[id] = incoming;
    } else {
      HARDPOOL[id].missCount = Math.max(HARDPOOL[id].missCount || 0, incoming.missCount || 0);
      HARDPOOL[id].everFlagged = !!(HARDPOOL[id].everFlagged || incoming.everFlagged);
      HARDPOOL[id].lastAt = Math.max(HARDPOOL[id].lastAt || 0, incoming.lastAt || 0);
    }
  });

  await persistHistory();
  await persistHardPool();
  alert("匯入完成，新增 " + addedCount + " 筆歷史紀錄（重複的紀錄已自動略過）。");
  renderAll();
}

function gradeColor(pct){
  if (pct >= 86) return { name: "金色", hex: "#B8933E" };
  if (pct >= 61) return { name: "藍色", hex: "#3B6EA5" };
  if (pct >= 41) return { name: "綠色", hex: "#3F7A5C" };
  if (pct >= 21) return { name: "棕色", hex: "#8C5A2B" };
  return { name: "橘色", hex: "#C9772E" };
}

let currentAudio = null;
function playClip(i){
  const src = AUDIO_DATA[i];
  if (!src){
    alert("這一題還沒有預錄音檔。");
    return;
  }
  if (currentAudio){
    currentAudio.pause();
  }
  currentAudio = new Audio(src);
  currentAudio.play();
}

function fmtTime(sec){
  const m = String(Math.floor(sec/60)).padStart(2,"0");
  const s = String(sec%60).padStart(2,"0");
  return m+":"+s;
}
function startTimer(){
  state.startTime = Date.now();
  clearInterval(state.timerHandle);
  state.timerHandle = setInterval(() => {
    const sec = Math.floor((Date.now() - state.startTime)/1000);
    document.getElementById("timerDisplay").textContent = fmtTime(sec);
  }, 1000);
}

function renderScantron(){
  const el = document.getElementById("scantron");
  if (state.screen !== "quiz"){
    el.innerHTML = "";
    return;
  }
  el.innerHTML = QUESTIONS.map((q, i) => {
    let cls = "bubble";
    if (state.answers[i] !== null) cls += " answered";
    if (state.flags[i]) cls += " flagged";
    if (i === state.index) cls += " current";
    return '<div class="' + cls + '">' + (i+1) + '</div>';
  }).join("");
}

}

function flagIcon(active){

  const stroke = active ? "#B8933E" : "#6B7280";
  return '<svg viewBox="0 0 24 24" width="13" height="13" xmlns="http://www.w3.org/2000/svg"><path d="M5 3v18M5 4h12l-3 4 3 4H5" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

function renderQuestion(){
  const i = state.index;
  const q = QUESTIONS[i];
  const selected = state.answers[i];
  const answered = selected !== null;
  const flagged = state.flags[i];

  let mediaHtml = "";
  if (q.mode === "audioChoices"){
    mediaHtml = '<div class="audio-block"><button class="play-btn" onclick="playAudioChoices(' + i + ')" aria-label="播放聽力">' + playIcon() + '</button>' +
      '<div class="audio-meta"><div class="label">' + q.audioLabel + '</div><div class="desc">' + (q.voiceNote || "") + ' · 點擊播放，可重複聆聽；文字選項將於作答後顯示逐字稿</div></div></div>';
  } else if (q.mode === "audioPassage"){
    mediaHtml = '<div class="audio-block"><button class="play-btn" onclick="playAudioPassage(' + i + ')" aria-label="播放對話或獨白">' + playIcon() + '</button>' +
      '<div class="audio-meta"><div class="label">' + q.audioLabel + '</div><div class="desc">' + (q.voiceNote || "") + ' · 點擊播放，可重複聆聽</div></div></div>';
  }

  let illustrationHtml = "";
  if (q.illustrationKey){
    illustrationHtml = '<div class="illustration">' + ILLUSTRATIONS[q.illustrationKey] + '</div>';
  }

  let passageHtml = "";
  if (q.mode === "textPassage"){
    const rendered = q.passage.replace(/\[BLANK\]/g, '<span class="blank">____</span>');
    passageHtml = '<div class="passage">' + rendered + '</div>';
  }

  const choicesHtml = q.choices.map(c => {
    let cls = "choice";
    if (c.key === selected) cls += " selected";
    const hideText = (q.mode === "audioChoices") && !answered;
    const label = hideText ? ("選項 " + c.key + "（點擊聆聽）") : c.text;
    return '<button class="' + cls + '" onclick="selectChoice(' + i + ", '" + c.key + '\')">' +
      '<span class="choice-key">' + c.key + '</span><span>' + label + '</span></button>';
  }).join("");

  const isLast = i === QUESTIONS.length - 1;
  const flagBtn = '<button class="flag-btn' + (flagged ? " active" : "") + '" onclick="toggleFlag(' + i + ')">' +
    flagIcon(flagged) + '<span>' + (flagged ? "已標記" : "標記") + '</span></button>';

  document.getElementById("screen").innerHTML =
    '<div class="card">' +
      '<div class="eyebrow">' +
        '<div class="eyebrow-left"><span class="eyebrow-part mono">' + q.part + '</span>' +
        '<span class="eyebrow-type">' + q.partLabel + ' · 第 ' + (i+1) + ' / ' + QUESTIONS.length + ' 題</span></div>' +
        flagBtn +
      '</div>' +
      mediaHtml + illustrationHtml + passageHtml +
      '<p class="prompt serif">' + q.prompt + '</p>' +
      '<div class="choices">' + choicesHtml + '</div>' +
      '<div class="actions">' +
        '<button class="btn btn-ghost" onclick="prevQuestion()" ' + (i===0 ? "disabled" : "") + '>← 上一題</button>' +
        '<button class="btn btn-primary" onclick="' + (isLast ? "submitExam()" : "nextQuestion()") + '" ' + (answered ? "" : "disabled") + '>' +
          (isLast ? "交卷 →" : "下一題 →") +
        '</button>' +
      '</div>' +
    '</div>';
}

function renderQuestionDetail(q, r){
  let passageHtml = "";
  if (q.mode === "textPassage" && q.passage){
    const rendered = q.passage.replace(/\[BLANK\]/g, '<span class="blank">____</span>');
    passageHtml = '<div class="passage">' + rendered + '</div>';
  }
  const choicesHtml = q.choices.map(c => {
    let cls = "mini-choice";
    if (c.key === q.answer) cls += " correct";
    if (r && r.chosen && c.key === r.chosen && r.chosen !== q.answer) cls += " wrong";
    return '<div class="' + cls + '"><span class="choice-key">' + c.key + '</span><span>' + c.text + '</span></div>';
  }).join("");
  const yourAnswerLine = r ? ('<div class="your-answer">你的作答：' + (r.chosen ? r.chosen : "未作答") + '</div>') : "";
  const conceptHtml = q.concept ? ('<div class="concept-tag">重點觀念：' + q.concept + '</div>') : "";
  return '<div class="detail-block">' +
    '<p class="prompt-mini serif">' + q.prompt + '</p>' +
    passageHtml +
    '<div class="mini-choices">' + choicesHtml + '</div>' +
    yourAnswerLine +
    '<div class="explain"><b>解析：</b>' + q.explanation + '</div>' +
    conceptHtml +
  '</div>';
}

function renderAttemptScreen(attempt, opts){
  const pct = Math.round((attempt.correctCount / attempt.total) * 100);
  const grade = gradeColor(pct);
  const d = new Date(attempt.timestamp);
  const dateStr = d.getFullYear() + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + String(d.getDate()).padStart(2,"0");

  const partRows = Object.keys(attempt.partBreakdown).map(p => {
    const b = attempt.partBreakdown[p];
    const w = Math.round((b.correct / b.total) * 100);
    return '<div class="breakdown-row"><span class="breakdown-label mono">' + p + '</span>' +
      '<div class="breakdown-track"><div class="breakdown-fill" style="width:' + w + '%"></div></div>' +
      '<span class="breakdown-count mono">' + b.correct + '/' + b.total + '</span></div>';
  }).join("");

  const detailRows = attempt.results.map((r, idx) => {
    const q = QUESTIONS[idx];
    let tag, showDetail;
    if (r.flagged){ tag = '<span class="tag flag">已標記</span>'; showDetail = true; }
    else if (r.isCorrect){ tag = '<span class="tag ok">答對</span>'; showDetail = false; }
    else { tag = '<span class="tag no">答錯</span>'; showDetail = true; }
    const detailHtml = showDetail ? renderQuestionDetail(q, r) : "";
    return '<div class="result-item"><div class="result-row"><span>' + q.part + ' · ' + q.partLabel + '</span>' + tag + '</div>' + detailHtml + '</div>';
  }).join("");

  const backBtn = opts.backBtn ? '<button class="btn btn-ghost back-btn" onclick="goHome()">← 回首頁</button>' : "";
  const summaryLine = opts.isFresh
    ? ('／ ' + attempt.total + ' 題正確（' + attempt.wrongCount + ' 題答錯' + (attempt.flaggedCount ? "，" + attempt.flaggedCount + " 題已標記" : "") + '）')
    : ('／ ' + attempt.total + ' 題正確 · ' + dateStr);
  const footerBtn = opts.isFresh
    ? '<div class="actions" style="justify-content:center; margin-top:26px;"><button class="btn btn-primary" onclick="goHome()">回首頁</button></div>'
    : "";

  document.getElementById("screen").innerHTML =
    '<div class="card">' +
      backBtn +
      '<div class="result-score"><div class="grade-badge" style="background:' + grade.hex + '">' + grade.name + '證書等級</div>' +
      '<div class="num serif">' + attempt.correctCount + '</div><div class="of">' + summaryLine + '</div></div>' +
      '<div class="breakdown">' + partRows + '</div>' +
      '<div class="result-list">' + detailRows + '</div>' +
      footerBtn +
    '</div>';
}

function renderResults(){
  if (!state.currentAttempt){ goHome(); return; }
  renderAttemptScreen(state.currentAttempt, { backBtn: false, isFresh: true });
}

function renderHistoryDetail(){
  const attempt = HISTORY.find(a => a.id === state.viewingAttemptId);
  if (!attempt){ goHome(); return; }
  renderAttemptScreen(attempt, { backBtn: true, isFresh: false });
}

function renderHardReview(){
  const ids = Object.keys(HARDPOOL);
  const rows = ids.map(id => {
    const q = QUESTIONS.find(qq => qq.id === id);
    if (!q) return "";
    const info = HARDPOOL[id];
    const tagText = info.everFlagged ? "已標記" : ("答錯 " + info.missCount + " 次");
    return '<div class="result-item"><div class="result-row"><span>' + q.part + ' · ' + q.partLabel + '</span>' +
      '<span class="tag ' + (info.everFlagged ? "flag" : "no") + '">' + tagText + '</span></div>' +
      renderQuestionDetail(q, null) +
    '</div>';
  }).join("");

  document.getElementById("screen").innerHTML =
    '<div class="card">' +
      '<button class="btn btn-ghost back-btn" onclick="goHome()">← 回首頁</button>' +
      '<h1 class="serif" style="margin:14px 0 16px;">難題複習</h1>' +
      '<div class="result-list">' + (rows || '<p class="empty-note">目前沒有需要複習的題目。</p>') + '</div>' +
    '</div>';
}

function startQuiz(){
  state.screen = "quiz";
  state.index = 0;
  state.answers = new Array(QUESTIONS.length).fill(null);
  state.flags = new Array(QUESTIONS.length).fill(false);
  state.currentAttempt = null;
  startTimer();
  renderAll();
}

function selectChoice(i, key){
  state.answers[i] = key;
  renderAll();
}

function toggleFlag(i){
  state.flags[i] = !state.flags[i];
  renderAll();
}

function playAudioChoices(i){
  playClip(i);
}

function playAudioPassage(i){
  playClip(i);
}

function stopAudio(){
  if (currentAudio){
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
}

function nextQuestion(){
  stopAudio();
  if (state.index < QUESTIONS.length - 1){
    state.index += 1;
    renderAll();
  }
}

function prevQuestion(){
  stopAudio();
  if (state.index > 0){
    state.index -= 1;
    renderAll();
  }
}

async function submitExam(){
  const unanswered = state.answers.filter(a => a === null).length;
  if (unanswered > 0){
    const ok = confirm("還有 " + unanswered + " 題尚未作答，確定要交卷嗎？");
    if (!ok) return;
  }
  stopAudio();
  clearInterval(state.timerHandle);

  const results = QUESTIONS.map((q, i) => {
    const chosen = state.answers[i];
    const flagged = state.flags[i];
    return { id: q.id, index: i, chosen, correct: q.answer, isCorrect: chosen === q.answer, flagged };
  });

  const correctCount = results.filter(r => r.isCorrect).length;
  const wrongCount = results.filter(r => !r.isCorrect && !r.flagged).length;
  const flaggedCount = results.filter(r => r.flagged).length;

  const partBreakdown = {};
  results.forEach((r, idx) => {
    const p = QUESTIONS[idx].part;
    if (!partBreakdown[p]) partBreakdown[p] = { correct: 0, total: 0 };
    partBreakdown[p].total += 1;
    if (r.isCorrect) partBreakdown[p].correct += 1;
  });

  const attempt = {
    id: "attempt-" + Date.now(),
    timestamp: Date.now(),
    total: QUESTIONS.length,
    correctCount,
    wrongCount,
    flaggedCount,
    results,
    partBreakdown
  };

  HISTORY.unshift(attempt);
  await persistHistory();

  results.forEach((r, idx) => {
    if (!r.isCorrect || r.flagged){
      const qid = QUESTIONS[idx].id;
      if (!HARDPOOL[qid]) HARDPOOL[qid] = { missCount: 0, everFlagged: false, lastAt: 0 };
      if (!r.isCorrect) HARDPOOL[qid].missCount += 1;
      if (r.flagged) HARDPOOL[qid].everFlagged = true;
      HARDPOOL[qid].lastAt = attempt.timestamp;
    }
  });
  await persistHardPool();

  state.currentAttempt = attempt;
  state.screen = "results";
  renderAll();
}

function viewHistoryDetail(id){
  state.viewingAttemptId = id;
  state.screen = "historyDetail";
  renderAll();
}

function viewHardReview(){
  state.screen = "hardReview";
  renderAll();
}

function goHome(){
  stopAudio();
  state.screen = "home";
  renderAll();
}

function renderAll(){
  renderScantron();
  if (state.screen === "home") renderHome();
  else if (state.screen === "quiz") renderQuestion();
  else if (state.screen === "results") renderResults();
  else if (state.screen === "historyDetail") renderHistoryDetail();
  else if (state.screen === "hardReview") renderHardReview();
}

async function init(){
  await loadPersistentData();
  renderAll();
}
init();
</script>
</body>
</html>
