<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Go Study Caterpillar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #1B2A4A;
    --navy-deep: #101A30;
    --ivory: #F6F2E7;
    --paper: #FFFDF8;
    --gold: #B8933E;
    --gold-light: #E4CE93;
    --gold-dim: #DCC488;
    --ink: #20232B;
    --slate: #6B7280;
    --border: #E4DDC6;
    --success: #3F7A5C;
    --success-bg: #E8F1EA;
    --error: #A9442F;
    --error-bg: #FBEAE4;
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--ivory);
    color: var(--ink);
    font-family: 'IBM Plex Sans', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .mono{ font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.02em; }
  a{ color: inherit; }
  button{ font-family: inherit; cursor: pointer; }
  button:disabled{ cursor: not-allowed; opacity: .45; }
  button:focus-visible, input:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }

  .app{ max-width: 820px; margin: 0 auto; padding: 0 20px 80px; }
  .topbar{
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color: var(--ivory);
    padding: 18px 20px 22px;
    margin: 0 0 28px;
  }
  .topbar-inner{ max-width: 820px; margin: 0 auto; }
  .exam-title{ font-size: 19px; font-weight: 600; margin:0; }
  .exam-sub{ font-size: 12px; color: var(--gold-light); margin: 2px 0 0; letter-spacing: 0.06em; }

  .card{
    background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 28px 28px 26px; box-shadow: 0 1px 2px rgba(27,42,74,0.04); margin-bottom: 18px;
  }
  .hero h1{ font-size: 24px; margin: 0 0 8px; }
  .hero p{ color: var(--slate); font-size: 14px; line-height: 1.7; max-width: 62ch; }

  .btn{ border: none; border-radius: 8px; padding: 11px 20px; font-size: 14px; font-weight: 600; }
  .btn-primary{ background: var(--navy); color: var(--ivory); }
  .btn-ghost{ background: transparent; color: var(--slate); border: 1px solid var(--border); }
  .btn-danger{ background: var(--error); color: #fff; }
  .btn-row{ display:flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .link-mini{ font-size: 12px; color: var(--slate); text-decoration: underline; background:none; border:none; padding:0; }
  .btn-mini{ background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 12px; color: var(--slate); flex-shrink:0; }
  .btn-mini:hover{ border-color: var(--gold); color: var(--navy); }

  .card-header-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px; }
  .card-header-row .section-title{ margin-bottom: 0; }
  .icon-btn-delete{
    flex-shrink:0; width: 30px; height: 30px; border-radius: 8px;
    background: transparent; border: 1px solid var(--border); color: var(--slate);
    display:flex; align-items:center; justify-content:center; font-size: 14px; padding:0;
  }
  .icon-btn-delete:hover{ border-color: var(--error); color: var(--error); background: var(--error-bg); }

  .status-card{ display:flex; justify-content: space-between; align-items:center; flex-wrap: wrap; gap: 10px; }
  .status-card .num{ font-family:'IBM Plex Mono',monospace; font-weight:700; color: var(--navy); }
  .pill{ display:inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 100px; background: var(--gold-light); color: var(--navy); margin-right: 6px; }

  .section-title{ font-size: 16px; margin: 0 0 10px; }
  .section-desc{ font-size: 12.5px; color: var(--slate); margin: 0 0 12px; }
  .history-row{ display:flex; justify-content:space-between; align-items:center; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; margin-bottom: 8px; gap: 10px; }
  .history-row .meta{ color: var(--slate); font-size: 12px; }
  .empty-note{ font-size: 13px; color: var(--slate); }

  /* 「檢視」單次考試明細頁：獨立一頁、不用色塊，純白底＋黑線表格 */
  .plain-card{ background:#fff; border: 1px solid #000; border-radius: 0; padding: 24px; margin-bottom: 18px; }
  .plain-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px; gap: 10px; }
  .plain-back{ background:none; border:none; padding:0; font-size:13px; color:#000; text-decoration:underline; }
  .plain-download-btn{ background:#000; color:#fff; border:none; border-radius: 4px; padding: 7px 14px; font-size: 12.5px; font-weight:600; }
  .plain-download-btn:hover{ opacity: .85; }
  .plain-title{ font-size: 18px; font-weight:700; margin: 0 0 6px; }
  .plain-desc{ font-size: 13px; color:#000; margin: 0 0 18px; }
  .plain-table{ width:100%; border-collapse: collapse; }
  .plain-table th, .plain-table td{ border: 1px solid #000; padding: 9px 12px; text-align:left; font-size: 14px; vertical-align: top; color:#000; }
  .plain-table th{ font-weight: 700; }

  /* 「檢視」頁下載 PDF：走瀏覽器列印，強制 A4、只印卡片內容 */
  .print-only{ display:none; }
  @media print{
    body{ background:#fff !important; }
    .topbar{ display:none !important; }
    .no-print{ display:none !important; }
    .print-only{ display:block; }
    .app{ max-width:none; padding:0; margin:0; }
    .card{ border:none; box-shadow:none; padding:0; border-radius:0; }
    .plain-card{ border:none; padding:0; margin:0; }
    table tr{ page-break-inside: avoid; }
    thead{ display: table-header-group; }
    /* 黑白列印：拿掉色塊，統一黑字黑線 */
    table, th, td{ border-color:#000 !important; color:#000 !important; }
    .tag, .pos-tag-sm, .pos-tag{ background:none !important; color:#000 !important; border:1px solid #000; }
    .example-toggle-cell, .examples-row{ display:none !important; }
    @page{ size: A4; margin: 18mm; }
  }

  /* quiz */
  .quiz-progress{ font-size: 12px; color: var(--slate); margin-bottom: 10px; display:flex; justify-content:space-between; }
  .progress-track{ height: 6px; background: var(--ivory); border-radius: 3px; overflow:hidden; margin-bottom: 22px; border:1px solid var(--border); }
  .progress-fill{ height: 100%; background: var(--gold); }
  .meaning-block{ margin-bottom: 26px; }
  .meaning-line{ font-size: 19px; line-height: 1.7; margin-bottom: 8px; }
  .pos-tag{ display:inline-block; font-family:'IBM Plex Mono',monospace; font-weight:700; color: var(--navy); background: var(--gold-light); padding: 2px 9px; border-radius: 6px; font-size: 13px; margin-right: 8px; vertical-align: 2px; }
  .meaning-line-compact{ font-size: 13px; line-height:1.6; margin-bottom: 4px; }
  .pos-tag-sm{ display:inline-block; font-family:'IBM Plex Mono',monospace; font-weight:700; color: var(--navy); background: var(--gold-light); padding: 1px 7px; border-radius: 5px; font-size: 11px; margin-right: 6px; }
  .answer-input{
    width:100%; font-size: 20px; padding: 14px 16px; border-radius: 10px;
    border: 1.5px solid var(--border); font-family:'IBM Plex Mono',monospace;
    background: var(--paper); color: var(--ink); letter-spacing: 0.02em;
  }
  .answer-input:focus{ border-color: var(--gold); }
  .quiz-hint{ font-size: 12px; color: var(--slate); margin-top: 8px; }
  .quiz-actions{ display:flex; justify-content:space-between; align-items:center; margin-top: 22px; }
  .flag-btn{
    display:flex; align-items:center; gap:5px; background: transparent; border: 1px solid var(--border);
    border-radius: 100px; padding: 7px 13px; font-size: 12.5px; color: var(--slate);
  }
  .flag-btn.active{ border-color: var(--gold); color: var(--navy); background: var(--gold-light); }

  /* result table */
  table{ width:100%; border-collapse: collapse; font-size: 13px; }
  th,td{ text-align:left; padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th{ color: var(--slate); font-weight:600; font-size: 11.5px; text-transform:uppercase; letter-spacing:.04em; }
  .tag{ font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 100px; display:inline-block; }
  .tag.ok{ background: var(--success-bg); color: var(--success); }
  .tag.no{ background: var(--error-bg); color: var(--error); }
  .tag.flag{ background: #EFE3C8; color: #8A6A1E; margin-left: 4px; }
  .muted{ color: var(--slate); }
  .search-input{
    width:100%; padding: 10px 14px; border-radius: 8px; border: 1.5px solid var(--border);
    font-size: 14px; margin-bottom: 14px; background: var(--paper);
  }
  .search-input:focus{ border-color: var(--gold); }

  /* 單字總表：例句 accordion */
  .word-col{ min-width: 140px; }
  .pagination{ display:flex; justify-content:space-between; align-items:center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .pagination-info{ font-size: 12.5px; color: var(--slate); display:flex; align-items:center; gap: 4px; }
  .page-jump-input{
    width: 46px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border);
    font-size: 12.5px; text-align:center; background: var(--paper); color: var(--ink);
  }
  .page-jump-input:focus{ border-color: var(--gold); }
  .example-toggle-cell{ text-align: right; white-space: nowrap; }
  .example-toggle-btn{
    background:none; border:none; padding: 4px; margin:0; cursor:pointer; color: var(--slate);
    display:inline-flex; align-items:center; justify-content:center; border-radius: 6px;
  }
  .example-toggle-btn:hover{ background: var(--ivory); color: var(--navy); }
  .example-toggle-btn:disabled{ opacity:.25; cursor:default; }
  .example-toggle-btn:disabled:hover{ background:none; }
  .example-toggle-btn .chevron{ display:inline-flex; transition: transform .15s ease; }
  .example-toggle-btn .chevron.open{ transform: rotate(90deg); }
  .examples-row td{ background: var(--ivory); padding: 12px 14px; }
  .example-item{ padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .example-item:last-child{ border-bottom: none; }
  .example-line{ display:flex; align-items:flex-start; justify-content:space-between; gap: 14px; flex-wrap: wrap; }
  .example-en{ font-size: 13.5px; line-height: 1.6; color: #33363E; flex:1; min-width: 200px; }
  .example-zh{ margin-top: 6px; font-size: 13px; color: #3A3D45; }
  .eye-btn{
    flex-shrink: 0; background: none; border: 1px solid var(--border); border-radius: 100px;
    padding: 3px 11px; font-size: 11.5px; color: var(--slate);
  }
  .eye-btn:hover{ border-color: var(--gold); color: var(--navy); background: var(--ivory); }
</style>
</head>

/* ---------------- 儲存 / 讀取 ---------------- */
const STORAGE_KEY = "toeic_cycle_state_v2";

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ return JSON.parse(raw); }
  }catch(e){ console.warn("讀取失敗，使用預設資料", e); }
  return {
    wordBank: defaultWordBank(),
    history: [],
    activeCycle: null,
    lastEndedRecord: null,
    screen: "home"
  };
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn("儲存失敗", e); }
}

let state = loadState();

/* 單字總表「例句」accordion 的展開狀態：純畫面狀態，不存進 localStorage，每次重新整理都預設收合 */
const expandedExampleWords = new Set();
const revealedExampleZh = new Set();

/* 單字總表分頁：單字庫可能持續變大，畫面一次只渲染一頁，避免整批 DOM 拖垮效能；
   分頁只影響畫面顯示，下載 PDF 一律輸出「目前搜尋篩選後」的全部單字，不受分頁限制 */
const MASTER_TABLE_PAGE_SIZE = 30;
let masterTablePage = 1;
function changeMasterTablePage(delta){
  masterTablePage += delta;
  renderMasterTable();
}
function jumpToMasterTablePage(value){
  const n = parseInt(value, 10);
  if(Number.isFinite(n)) masterTablePage = n;
  renderMasterTable();
}
function toggleWordExamples(wordId){
  if(expandedExampleWords.has(wordId)) expandedExampleWords.delete(wordId);
  else expandedExampleWords.add(wordId);
  renderMasterTable();
}
function toggleExampleZh(key){
  if(revealedExampleZh.has(key)) revealedExampleZh.delete(key);
  else revealedExampleZh.add(key);
  renderMasterTable();
}

/* ---------------- 工具函式 ---------------- */
function now(){ return new Date().toISOString(); }
function genId(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function getAllWordIds(){ return state.wordBank.map(w => w.id); }
function findWord(wordId){ return state.wordBank.find(w => w.id === wordId) || null; }
function deleteIconSvg(){
  return `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;
}
function chevronIconSvg(){
  return `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>`;
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* 中文意思顯示規則：同群組(同義詞)用「；」，同詞性下不同義項用數字編號，不同詞性逐行列出 */
function formatMeaningLines(word){
  return word.posGroups.map(pg => {
    const body = pg.meaningGroups.length > 1
      ? pg.meaningGroups.map((g,i) => `${i+1}. ${g.join('；')}`).join('　')
      : pg.meaningGroups[0].join('；');
    return { pos: pg.pos, text: body };
  });
}
function meaningLinesHtml(word, opts){
  const compact = opts && opts.compact;
  const lineClass = compact ? "meaning-line-compact" : "meaning-line";
  const tagClass = compact ? "pos-tag-sm" : "pos-tag";
  return formatMeaningLines(word).map(l =>
    `<div class="${lineClass}"><span class="${tagClass} mono">(${l.pos})</span>${l.text}</div>`
  ).join("");
}

/* 單字總表 accordion 展開後的例句列表；中文預設隱藏，按「顯示中文」才打開（各例句各自獨立） */
function examplesHtml(word){
  return word.examples.map((ex, idx) => {
    const key = word.id + ":" + idx;
    const revealed = revealedExampleZh.has(key);
    return `
      <div class="example-item">
        <div class="example-line">
          <div class="example-en">${ex.en}</div>
          <button class="eye-btn" onclick="toggleExampleZh('${key}')">${revealed ? "隱藏中文" : "顯示中文"}</button>
        </div>
        ${revealed ? `<div class="example-zh">${ex.zh}</div>` : ""}
      </div>
    `;
  }).join("");
}

/* ---------------- 循環邏輯 ---------------- */
function startCycle(){
  state.activeCycle = {
    id: genId("cycle"), startedAt: now(), roundIndex: 1,
    errorPool: [], flags: [], roundHistory: [], currentRound: null, initialWordCount: 0
  };
  startRound();
  state.screen = "quiz";
  saveState(); renderAll();
}

function startRound(){
  const c = state.activeCycle;
  const pool = c.roundIndex === 1 ? getAllWordIds() : c.errorPool.slice();
  c.currentRound = { queue: shuffle(pool), index: 0, answers: [], startedAt: now() };
  if(c.roundIndex === 1){ c.initialWordCount = c.currentRound.queue.length; }
}

function toggleFlag(wordId){
  const c = state.activeCycle;
  const i = c.flags.indexOf(wordId);
  if(i === -1) c.flags.push(wordId); else c.flags.splice(i,1);
  saveState(); renderAll();
}

function submitCurrent(rawValue){
  const c = state.activeCycle;
  const r = c.currentRound;
  const wordId = r.queue[r.index];
  const word = findWord(wordId);
  const val = (rawValue||"").trim();
  const correct = val.length>0 && val.toLowerCase() === word.english.toLowerCase();
  r.answers.push({ wordId, userInput: val, correct });
  r.index += 1;
  if(r.index >= r.queue.length){
    finishRound();
  } else {
    saveState(); renderAll();
  }
}

function finishRound(){
  const c = state.activeCycle;
  const r = c.currentRound;
  const roundIndex = c.roundIndex;

  r.answers.forEach(a => {
    const word = findWord(a.wordId);
    if(!word) return;
    word.stats = { lastResult: a.correct ? "correct" : "wrong", lastTestedAt: now() };
    if(!a.correct) word.wrongCount += 1;
  });

  const newPool = [];
  r.answers.forEach(a => {
    const flagged = c.flags.includes(a.wordId);
    if(!a.correct || flagged) newPool.push(a.wordId);
  });
  c.errorPool = [...new Set(newPool)];

  c.roundHistory.push({
    roundIndex, results: r.answers, startedAt: r.startedAt, endedAt: now(),
    remaining: c.errorPool.length, total: c.initialWordCount
  });
  c.currentRound = null;
  c.roundIndex += 1;

  state.screen = "roundResult";
  saveState(); renderAll();
}

function nextRound(){
  startRound();
  state.screen = "quiz";
  saveState(); renderAll();
}

function endCycle(){
  if(!confirm("確定要結束這個循環嗎？結束後這個循環的錯誤題庫會清空（不影響單字的歷史累計錯誤次數）。")) return;
  const c = state.activeCycle;
  const initialCount = c.initialWordCount;
  const remaining = c.errorPool.length;
  const record = {
    id: c.id, startedAt: c.startedAt, endedAt: now(),
    totalRounds: c.roundHistory.length,
    initialWordCount: initialCount,
    finalMasteredCount: initialCount - remaining,
    remainingUnmasteredCount: remaining,
    endedReason: remaining === 0 ? "pool_empty" : "user_terminated",
    roundBreakdown: c.roundHistory.map(h => ({ roundIndex: h.roundIndex, remaining: h.remaining, total: h.total, endedAt: h.endedAt, results: h.results }))
  };
  state.history.unshift(record);
  state.lastEndedRecord = record;
  state.activeCycle = null;
  state.screen = "cycleEnd";
  saveState(); renderAll();
}

function goHome(){ state.screen = "home"; saveState(); renderAll(); }
function goMasterTable(){ state.screen = "masterTable"; saveState(); renderAll(); }
function resumeActiveCycle(){
  const c = state.activeCycle;
  state.screen = c.currentRound ? "quiz" : "roundResult";
  saveState(); renderAll();
}
function viewHistoryDetail(id){
  state._viewHistoryId = id;
  state.screen = "historyDetail";
  saveState(); renderAll();
}
function resetDemoData(){
  const count = defaultWordBank().length;
  if(!confirm(`確定要清空所有資料並還原成預設的 ${count} 個單字嗎？此動作無法復原。`)) return;
  state = { wordBank: defaultWordBank(), history: [], activeCycle: null, lastEndedRecord: null, screen: "home" };
  saveState(); renderAll();
}

/* 「檢視」導覽：sourceKey 標記這次考試紀錄要去哪裡找（進行中循環，或某個已結束循環的歷史） */
function viewAttempt(sourceKey, roundIndex){
  state._viewAttempt = { sourceKey, roundIndex };
  state._viewAttemptFrom = state.screen;
  state.screen = "attemptDetail";
  saveState(); renderAll();
}
function resolveAttempt(sourceKey, roundIndex){
  if(sourceKey === "active"){
    return state.activeCycle ? state.activeCycle.roundHistory.find(h => h.roundIndex === roundIndex) : null;
  }
  if(sourceKey && sourceKey.indexOf("history:") === 0){
    const id = sourceKey.slice("history:".length);
    const rec = state.history.find(h => h.id === id);
    return rec ? rec.roundBreakdown.find(h => h.roundIndex === roundIndex) : null;
  }
  return null;
}
function goBackFromAttempt(){
  state.screen = state._viewAttemptFrom || "home";
  saveState(); renderAll();
}
/* 瀏覽器列印表頭/表尾（日期、網址）由瀏覽器自己的「頁首及頁尾」設定控制，
   網頁本身無法強制關閉；把 document.title 暫時清空，至少讓頁首中間的標題欄不顯示網站標題。 */
function printWithBlankTitle(){
  const originalTitle = document.title;
  document.title = "";
  const restoreTitle = () => {
    document.title = originalTitle;
    window.removeEventListener("afterprint", restoreTitle);
  };
  window.addEventListener("afterprint", restoreTitle);
  window.print();
  setTimeout(restoreTitle, 4000);
}
function downloadAttemptPdf(){ printWithBlankTitle(); }
function downloadMasterTablePdf(){ printWithBlankTitle(); }

/* 每次考試「還剩幾個不熟單字 / 交卷時間」列表，home／roundResult／cycleEnd／historyDetail 共用；
   sourceKey 供每列的「檢視」按鈕導覽到單獨的明細頁 */
function roundBreakdownHtml(entries, sourceKey){
  if(!entries || entries.length === 0) return '<p class="empty-note">尚無考試紀錄。</p>';
  return entries.slice().reverse().map(e => `
    <div class="history-row">
      <div>第 ${e.roundIndex} 次 · <span class="num mono">${e.remaining}</span><span class="mono">/${e.total}</span></div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="meta">${fmtDate(e.endedAt)}</span>
        <button class="btn-mini" onclick="viewAttempt('${sourceKey}', ${e.roundIndex})">檢視</button>
      </div>
    </div>
  `).join("");
}

/* 純文字版的詞性／中文意思（供「檢視」明細頁使用，不帶顏色色塊） */
function plainMeaningLines(word){
  return formatMeaningLines(word).map(l => `(${l.pos}) ${l.text}`).join("<br>");
}

/* ---------------- 畫面渲染 ---------------- */
const screenEl = document.getElementById("screen");

function renderAll(){
  if(state.screen === "quiz") renderQuiz();
  else if(state.screen === "roundResult") renderRoundResult();
  else if(state.screen === "cycleEnd") renderCycleEnd();
  else if(state.screen === "masterTable") renderMasterTable();
  else if(state.screen === "historyDetail") renderHistoryDetail();
  else if(state.screen === "attemptDetail") renderAttemptDetail();
  else renderHome();
}

function renderAttemptDetail(){
  const v = state._viewAttempt || {};
  const entry = resolveAttempt(v.sourceKey, v.roundIndex);
  if(!entry){ goHome(); return; }

  const wrongWords = (entry.results || [])
    .filter(a => !a.correct)
    .map(a => findWord(a.wordId))
    .filter(Boolean);

  const rows = wrongWords.length
    ? wrongWords.map(w => `<tr><td>${w.english}</td><td>${plainMeaningLines(w)}</td></tr>`).join("")
    : `<tr><td colspan="2">這次考試全部答對，沒有答錯的單字。</td></tr>`;

  screenEl.innerHTML = `
    <div class="plain-card">
      <div class="plain-toolbar no-print">
        <button class="plain-back" onclick="goBackFromAttempt()">← 返回</button>
        <button class="plain-download-btn" onclick="downloadAttemptPdf()">下載 PDF</button>
      </div>
      <p class="plain-title">${entry.roundIndex} Round</p>
      <p class="plain-desc">${fmtDate(entry.endedAt)}</p>
      <table class="plain-table">
        <thead><tr><th>英文</th><th>詞性</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function renderHome(){
  const totalWords = state.wordBank.length;
  let html = `
    <div class="card hero">
      <h1>循環模式</h1>
      <p>目前單字庫：<b>${totalWords}</b> 個單字。每次考試只考「上一次答錯或標記 flag」的字，直到你判斷已經記熟、手動結束循環為止。</p>
    </div>
  `;

  if(state.activeCycle){

    }
    html += `</div>`;
    html += `<p class="section-desc">這個循環已進行 <b>${c.roundHistory.length}</b> 次考試，錯誤題庫剩 <b>${c.errorPool.length}</b> 題${inProgress ? '（有一次考試進行到一半，尚未交卷）' : ''}。</p>`;

      html += `<div class="btn-row"><button class="btn btn-primary" onclick="resumeActiveCycle()">繼續這次考試</button></div>`;

    }

      <div class="meaning-block">${meaningLinesHtml(word)}</div>

      <input id="answerInput" class="answer-input mono" type="text" autocomplete="off"
        autocapitalize="off" autocorrect="off" spellcheck="false"
        placeholder="輸入英文原形…" />
      <p class="quiz-hint">按 <b>Enter</b> 送出（不記得可直接按 Enter 跳過，視為答錯）</p>

      <div class="quiz-actions">
        <button class="flag-btn ${isFlagged?'active':''}" onclick="toggleFlag('${wordId}')">
          ${isFlagged ? '★ 已標記' : '☆ 標記 flag'}
        </button>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-ghost" onclick="goHome()">暫停（回首頁）</button>
          <button class="btn btn-primary" onclick="submitFromInput()">送出</button>
        </div>
      </div>
    </div>
  `;
  const input = document.getElementById("answerInput");
  input.focus();
  input.onkeydown = (e) => { if(e.key === "Enter"){ e.preventDefault(); submitFromInput(); } };
}
function submitFromInput(){
  const input = document.getElementById("answerInput");
  submitCurrent(input ? input.value : "");
}

function renderRoundResult(){
  const c = state.activeCycle;
  const round = c.roundHistory[c.roundHistory.length - 1];
  let rows = "";
  round.results.forEach(a => {
    const word = findWord(a.wordId);
    const flagged = c.flags.includes(a.wordId);
    rows += `
      <tr>
        <td class="mono"><b>${word.english}</b></td>
        <td>${meaningLinesHtml(word, {compact:true})}</td>
        <td class="mono">${a.userInput ? a.userInput : '<span class="muted">（跳過）</span>'}</td>
        <td>
          <span class="tag ${a.correct?'ok':'no'}">${a.correct?'正確':'錯誤'}</span>
          ${flagged ? '<span class="tag flag">flag</span>' : ''}
        </td>
      </tr>`;
  });

  const poolEmpty = c.errorPool.length === 0;

  screenEl.innerHTML = `
    <div class="card">
      <div class="card-header-row">
        <p class="section-title">第 ${round.roundIndex} 次考試結果</p>
        <button class="icon-btn-delete" onclick="endCycle()" title="結束循環">${deleteIconSvg()}</button>
      </div>
      <p class="section-desc">
        這次考試 ${round.results.length} 題，答對 ${round.results.filter(a=>a.correct).length} 題。
        更新後仍不熟：<b>${round.remaining}/${round.total}</b>。
      </p>
      <table>
        <thead><tr><th>英文</th><th>詞性／中文意思</th><th>你的作答</th><th>結果</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="nextRound()" ${poolEmpty ? 'disabled' : ''}>
          開始下一次考試（${c.errorPool.length} 題）
        </button>
        <button class="btn btn-ghost" onclick="goHome()">回首頁（稍後繼續）</button>
      </div>
      ${poolEmpty ? '<p class="quiz-hint" style="margin-top:12px;">錯誤題庫已清空，這個循環的字都至少答對且沒被標記 flag，可以按右上角的圖示結束循環了。</p>' : ''}
    </div>
    <div class="card">
      <p class="section-title">本循環歷次考試紀錄</p>
      <p class="section-desc">每次交卷後還剩幾個不熟單字，以及交卷時間。</p>
      ${roundBreakdownHtml(c.roundHistory, "active")}
    </div>
  `;
}

function renderCycleEnd(){
  const rec = state.lastEndedRecord;
  const reasonLabel = rec.endedReason === "pool_empty" ? "錯誤題庫自然清空" : "手動結束";
  screenEl.innerHTML = `
    <div class="card">
      <p class="section-title">循環結束</p>
      <table>
        <tbody>
          <tr><th>總考試次數</th><td>${rec.totalRounds}</td></tr>
          <tr><th>第一次題數</th><td>${rec.initialWordCount}</td></tr>
          <tr><th>精熟題數</th><td>${rec.finalMasteredCount}</td></tr>
          <tr><th>未精熟（結束時仍在錯誤題庫）</th><td>${rec.remainingUnmasteredCount}</td></tr>
          <tr><th>結束原因</th><td>${reasonLabel}</td></tr>
          <tr><th>時間</th><td>${fmtDate(rec.startedAt)} ~ ${fmtDate(rec.endedAt)}</td></tr>
        </tbody>
      </table>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="goHome()">回首頁</button>
        <button class="btn btn-ghost" onclick="goMasterTable()">查看單字總表</button>
      </div>
    </div>
    <div class="card">
      <p class="section-title">各次考試紀錄</p>
      ${roundBreakdownHtml(rec.roundBreakdown, "history:" + rec.id)}
    </div>
  `;
}

function renderHistoryDetail(){
  const rec = state.history.find(h => h.id === state._viewHistoryId);
  if(!rec){ goHome(); return; }
  const reasonLabel = rec.endedReason === "pool_empty" ? "錯誤題庫自然清空" : "手動結束";
  screenEl.innerHTML = `
    <div class="card">
      <button class="link-mini" style="margin-bottom:14px;" onclick="goHome()">← 回首頁</button>
      <p class="section-title">循環紀錄</p>
      <table>
        <tbody>
          <tr><th>總考試次數</th><td>${rec.totalRounds}</td></tr>
          <tr><th>第一次題數</th><td>${rec.initialWordCount}</td></tr>
          <tr><th>精熟題數</th><td>${rec.finalMasteredCount}</td></tr>
          <tr><th>未精熟</th><td>${rec.remainingUnmasteredCount}</td></tr>
          <tr><th>結束原因</th><td>${reasonLabel}</td></tr>
          <tr><th>時間</th><td>${fmtDate(rec.startedAt)} ~ ${fmtDate(rec.endedAt)}</td></tr>
        </tbody>
      </table>
    </div>
    <div class="card">
      <p class="section-title">各次考試紀錄</p>
      ${roundBreakdownHtml(rec.roundBreakdown || [], "history:" + rec.id)}
    </div>
  `;
}

function renderMasterTable(){
  const q = (state._searchQuery || "").trim().toLowerCase();
  const filteredWords = state.wordBank.filter(w => {
    const hay = (w.english + " " + w.posGroups.map(pg => pg.pos + " " + pg.meaningGroups.map(g=>g.join(" ")).join(" ")).join(" ")).toLowerCase();
    return !q || hay.includes(q);
  });

  const totalPages = Math.max(1, Math.ceil(filteredWords.length / MASTER_TABLE_PAGE_SIZE));
  if(masterTablePage < 1) masterTablePage = 1;
  if(masterTablePage > totalPages) masterTablePage = totalPages;
  const pageStart = (masterTablePage - 1) * MASTER_TABLE_PAGE_SIZE;
  const pageWords = filteredWords.slice(pageStart, pageStart + MASTER_TABLE_PAGE_SIZE);

  let rows = "";
  pageWords.forEach(w => {
    const lastResult = w.stats ? (w.stats.lastResult === "correct" ? "對" : "錯") : "尚未測過";
    const hasExamples = w.examples && w.examples.length > 0;
    const isOpen = expandedExampleWords.has(w.id);

    rows += `
      <tr>
        <td class="mono word-col"><b>${w.english}</b></td>
        <td>${meaningLinesHtml(w, {compact:true})}</td>
        <td class="mono">${w.wrongCount}</td>
        <td><span class="tag ${lastResult==='對'?'ok':(lastResult==='錯'?'no':'')}">${lastResult}</span></td>
        <td class="example-toggle-cell">
          <button class="example-toggle-btn" onclick="toggleWordExamples('${w.id}')" ${hasExamples ? "" : "disabled"} title="${hasExamples ? "展開例句" : "沒有例句"}">
            <span class="chevron ${isOpen ? "open" : ""}">${chevronIconSvg()}</span>
          </button>
        </td>
      </tr>`;
    if(isOpen && hasExamples){
      rows += `<tr class="examples-row"><td colspan="5">${examplesHtml(w)}</td></tr>`;
    }
  });
  if(!rows) rows = `<tr><td colspan="5" class="empty-note">沒有符合的結果。</td></tr>`;

  /* 列印用的簡化版：跟「檢視」考試錯誤頁同一種格式，只有英文＋詞性兩欄，不帶色塊 */
  const printRows = filteredWords.length
    ? filteredWords.map(w => `<tr><td>${w.english}</td><td>${plainMeaningLines(w)}</td></tr>`).join("")
    : `<tr><td colspan="2">沒有符合的結果。</td></tr>`;

  screenEl.innerHTML = `
    <div class="card no-print">
      <div class="plain-toolbar">
        <button class="link-mini" onclick="goHome()">← 回首頁</button>
        <button class="plain-download-btn" onclick="downloadMasterTablePdf()">下載 PDF</button>
      </div>
      <p class="section-title">單字總表</p>
      <input id="searchInput" class="search-input" type="text" placeholder="搜尋英文或中文意思…" value="${state._searchQuery || ''}" />
      <table>
        <thead>
          <tr><th class="word-col">英文</th><th>詞性／中文意思</th><th>錯誤次數</th><th>最近結果</th><th class="example-toggle-cell"></th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="pagination">
        <button class="btn-mini" onclick="changeMasterTablePage(-1)" ${masterTablePage <= 1 ? "disabled" : ""}>← 上一頁</button>
        <span class="pagination-info">
          第 <input class="page-jump-input mono" type="number" min="1" max="${totalPages}" value="${masterTablePage}"
            onchange="jumpToMasterTablePage(this.value)" /> / ${totalPages} 頁　共 ${filteredWords.length} 個字
        </span>
        <button class="btn-mini" onclick="changeMasterTablePage(1)" ${masterTablePage >= totalPages ? "disabled" : ""}>下一頁 →</button>
      </div>
    </div>
    <div class="plain-card print-only">
      <p class="plain-title">單字總表</p>
      <table class="plain-table">
        <thead><tr><th>英文</th><th>詞性</th></tr></thead>
        <tbody>${printRows}</tbody>
      </table>
    </div>
  `;
  const searchInput = document.getElementById("searchInput");
  searchInput.oninput = (e) => { state._searchQuery = e.target.value; masterTablePage = 1; renderMasterTable(); };
  searchInput.focus();
  searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
}

renderAll();
</script>
</body>
</html>
